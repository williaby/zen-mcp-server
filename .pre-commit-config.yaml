---
default_stages: [pre-commit, pre-push]
repos:
  # #EDGE: black + isort previously ran alongside ruff's linter here, but CI
  # (python-ci.yml) enforces `ruff format --check`, not black. Black and
  # ruff-format disagree on multi-line assert-with-message wrapping, so a
  # pre-commit run kept undoing what CI required, and vice versa. Standardize
  # on ruff for both lint and format, matching the fleet-wide pattern.
  # #VERIFY: if a future ruff-format vs ruff-lint disagreement appears,
  # confirm CI and pre-commit still invoke the same ruff version (uv.lock).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49  # v0.16.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

# Configuration for specific tools
default_language_version:
  python: python3

# Exclude patterns
exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    venv/|
    \.pal_venv/|
    __pycache__/|
    \.pytest_cache/|
    logs/|
    dist/|
    build/|
    test_simulation_files/
  )
