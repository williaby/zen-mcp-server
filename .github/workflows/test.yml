name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          # Run only unit tests (exclude simulation tests and integration tests)
          # Integration tests require local-llama which isn't available in CI
          # #EDGE: --cov targets use module names (server, config), not file paths
          # (server.py, config.py). tools/custom/__init__.py auto-imports every
          # tool module at package-import time, including band_selector.py's
          # import of pandas. A file-path coverage target makes coverage.py load
          # the module through a second, separate loader in addition to pytest's
          # normal import, so pandas (and numpy underneath it) gets initialized
          # twice in one process; numpy's C extension refuses a second init and
          # raises "cannot load module more than once per process", failing
          # collection of tests/test_consensus_models.py.
          # #VERIFY: if coverage.py changes how it resolves bare-name versus
          # file-path targets, re-check this still avoids the double import.
          python -m pytest tests/ -v --ignore=simulator_tests/ -m "not integration" --timeout=60 --cov=tools --cov=utils --cov=providers --cov=routing --cov=systemprompts --cov=server --cov=config --cov-report=xml --cov-report=term-missing
        env:
          # Ensure no API key is accidentally used in CI
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unit
          name: unit-tests-${{ matrix.python-version }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run black formatter check
        run: black --check . --exclude="test_simulation_files/"

      - name: Run ruff linter
        run: ruff check . --exclude test_simulation_files
