name: Docker Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (leave empty for latest release)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for `gh release edit`
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7  # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # If triggered by workflow_dispatch with a tag, checkout that tag
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # v5.6.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag with the release version
            type=semver,pattern={{version}},value=${{ inputs.tag || github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.event.release.tag_name }}
            # Also tag as latest for the most recent release
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update release with Docker info
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass user-controlled fields via env to avoid shell injection through
          # GitHub Actions expression interpolation into the run: script.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
          DOCKER_TAGS_RAW: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          DOCKER_TAGS=$(printf '%s' "$DOCKER_TAGS_RAW" | tr '\n' ' ')
          # Build the release notes file using printf and python (no shell heredoc),
          # so user-controlled $RELEASE_BODY can never trigger $(...) or backtick
          # expansion. printf %s treats its argument as literal data.
          NOTES_FILE="$(mktemp)"
          {
            printf '%s\n\n---\n\n## Docker Images\n\nThis release is available as Docker images:\n\n' "$RELEASE_BODY"
            printf '%s\n' "$DOCKER_TAGS" | sed 's/ghcr.io/- `ghcr.io/g' | sed 's/ /`\n/g'
            printf '\n**Quick start with Docker:**\n```bash\ndocker pull ghcr.io/%s:%s\n```\n\n' "$REPO" "$RELEASE_TAG"
            printf '**Claude Desktop configuration:**\n```json\n{\n  "mcpServers": {\n    "pal-mcp-server": {\n      "command": "docker",\n      "args": [\n        "run", "--rm", "-i",\n        "-e", "GEMINI_API_KEY",\n        "ghcr.io/%s:%s"\n      ],\n      "env": {\n        "GEMINI_API_KEY": "your-api-key-here"\n      }\n    }\n  }\n}\n```\n' "$REPO" "$RELEASE_TAG"
          } > "$NOTES_FILE"
          gh release edit "$RELEASE_TAG" --notes-file "$NOTES_FILE"
          rm -f "$NOTES_FILE"

      - name: Create deployment summary
        run: |
          echo "## 🐳 Docker Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release**: ${{ inputs.tag || github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Images built:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
